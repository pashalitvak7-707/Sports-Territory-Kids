<script>
  /* Enable the scroll-reveal animation only when JS is running, and add a
     fail-safe: if the reveal observer hasn't marked itself ready shortly
     after load, force every section visible so nothing stays blank. */
  document.documentElement.className += ' js-reveal';
  setTimeout(function () {
    if (!window.__revealReady) {
      var e = document.querySelectorAll('.reveal');
      for (var i = 0; i < e.length; i++) e[i].classList.add('in');
    }
  }, 3000);
</script>
